<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Absolute Pitch</title>
  <meta property="og:title" content="Absolute Pitch" />
  <meta property="og:description" content="Train your pitch skills." />
  <meta property="og:image" content="assets/logo-placeholder.svg" />
  <meta property="og:image:alt" content="Absolute Pitch logo" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="assets/logo-placeholder.svg" />
  <link rel="stylesheet" href="../../shared/style.css" />
</head>
<body>
  <main class="card">
    <div class="logo-wrap" aria-hidden="true">
      <img id="appLogo" src="assets/logo-placeholder.svg" alt="Absolute Pitch logo" />
    </div>
    <h1 id="pageTitle">Absolute Pitch</h1>
    <p id="pageDescription">Train your pitch skills.</p>
    <p id="releaseDate" class="release-date"></p>

    <div class="buttons">
      <a class="store-btn" id="appStoreBtn" href="https://apps.apple.com/app/id0000000000" aria-label="Open in the App Store">
        <span class="icon" aria-hidden="true">
          <img src="../../shared/assets/appStore.jpeg" alt="" />
        </span>
        <span class="label">App Store</span>
      </a>
      <a class="store-btn secondary" id="playStoreBtn" href="https://play.google.com/store/apps/details?id=com.example.app" aria-label="Open in the Play Store">
        <span class="icon" aria-hidden="true">
          <img src="../../shared/assets/playStore.png" alt="" />
        </span>
        <span class="label">Play Store</span>
      </a>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </main>

  <script src="./app-config.js"></script>
  <script src="../../shared/app.js"></script>
</body>
</html>
