<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get the App</title>
  <style>
    :root {
      --ink: #1b1b1b;
      --muted: #5b5b5b;
      --cream: #f6f0e6;
      --peach: #f4c9a8;
      --sea: #3a8d8f;
      --gold: #d39a3e;
      --card: rgba(255, 255, 255, 0.78);
      --shadow: 0 18px 40px rgba(27, 27, 27, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Playfair Display", "Times New Roman", serif;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(60vw 40vw at 10% 15%, rgba(244, 201, 168, 0.55), transparent 60%),
        radial-gradient(45vw 30vw at 90% 20%, rgba(58, 141, 143, 0.35), transparent 65%),
        linear-gradient(160deg, #fff7ee 0%, #f3efe9 45%, #f7f1e3 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(27, 27, 27, 0.05) 0px,
        rgba(27, 27, 27, 0.05) 1px,
        transparent 1px,
        transparent 12px
      );
      opacity: 0.2;
      pointer-events: none;
    }

    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 36px 32px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      backdrop-filter: blur(8px);
      animation: float-in 700ms ease-out both;
    }

    .logo-wrap {
      width: 140px;
      height: 140px;
      border-radius: 38px;
      background: linear-gradient(135deg, rgba(211, 154, 62, 0.2), rgba(58, 141, 143, 0.2));
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(27, 27, 27, 0.1);
    }

    .logo-wrap img {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: 0.01em;
    }

    p {
      margin: 0;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      font-size: 16px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .store-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: #111111;
      color: #fff4e7;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: 15px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
      animation: rise 800ms ease-out both;
    }

    .store-btn.secondary {
      background: #f4efe6;
      color: #1b1b1b;
      border-color: rgba(27, 27, 27, 0.1);
    }

    .store-btn.recommended {
      background: linear-gradient(120deg, #1b1b1b 0%, #374c4d 100%);
      box-shadow: 0 10px 22px rgba(27, 27, 27, 0.25);
    }

    .store-btn:hover {
      transform: translateY(-2px);
    }

    .status {
      font-size: 14px;
      color: #3b3b3b;
      min-height: 20px;
      text-align: center;
    }

    .hint {
      font-size: 12px;
      color: rgba(27, 27, 27, 0.45);
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 640px) {
      .buttons {
        flex-direction: row;
      }

      .store-btn {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .store-btn {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap" aria-hidden="true">
      <img src="logo512.jpg" alt="App logo" />
    </div>
    <h1>Open the app store</h1>
    <p>We will guide you to the right store for your device. You can also choose manually.</p>

    <div class="buttons">
      <a class="store-btn" id="appStoreBtn" href="https://apps.apple.com/app/id0000000000" aria-label="Open in the App Store">
        App Store
      </a>
      <a class="store-btn secondary" id="playStoreBtn" href="https://play.google.com/store/apps/details?id=com.example.app" aria-label="Open in the Play Store">
        Play Store
      </a>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hint">Logo loaded from <strong>logo512.jpg</strong>.</div>
  </main>

  <script>
    const appStoreUrl = "https://apps.apple.com/app/id0000000000";
    const playStoreUrl = "https://play.google.com/store/apps/details?id=com.example.app";

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const statusEl = document.getElementById("status");
    const appStoreBtn = document.getElementById("appStoreBtn");
    const playStoreBtn = document.getElementById("playStoreBtn");

    const markRecommended = (button) => {
      if (!button) return;
      button.classList.add("recommended");
      button.insertAdjacentHTML("beforeend", "<span aria-hidden='true'>→</span>");
    };

    const redirectTo = (url, label) => {
      statusEl.textContent = `Opening ${label}...`;
      setTimeout(() => {
        window.location.href = url;
      }, 1100);
    };

    if (isIOS) {
      markRecommended(appStoreBtn);
      redirectTo(appStoreUrl, "the App Store");
    } else if (isAndroid) {
      markRecommended(playStoreBtn);
      redirectTo(playStoreUrl, "the Play Store");
    } else {
      statusEl.textContent = "We could not detect your device. Please choose a store.";
    }
  </script>
</body>
</html>
